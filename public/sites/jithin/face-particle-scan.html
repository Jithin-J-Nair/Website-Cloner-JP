const renderer = new THREE.WebGLRenderer({antialias:false, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);                    // transparent canvas
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(35,1,.1,60);
const group = new THREE.Group(); group.position.y = -.22; group.rotation.y = CFG.faceYaw; scene.add(group);

const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
const pixels = i => { const c = document.createElement('canvas'); c.width = i.width; c.height = i.height;
  const x = c.getContext('2d',{willReadFrequently:true}); x.drawImage(i,0,0); return x.getImageData(0,0,c.width,c.height).data; };

const U = { uTime:{value:0}, uForm:{value:0}, uScanY:{value:9}, uDir:{value:-1}, uScan:{value:0}, uReveal:{value:1},
  uPx:{value:3}, uCam:{value:7}, uTint:{value:new THREE.Vector3(...CFG.tint)}, uScanCol:{value:new THREE.Vector3(...CFG.scanTint)} };

const VERT = `
attribute vec3 aStart; attribute vec4 aSeed; attribute float aI;
uniform float uTime,uForm,uScanY,uDir,uScan,uReveal,uPx,uCam,uSizeK,uAlphaK; uniform vec3 uTint,uScanCol;
varying vec3 vCol; varying float vA;
void main(){
  float t = clamp((uForm - aSeed.x*.55)/.45, 0., 1.);
  float e = 1. - pow(1.-t, 3.);
  vec3 p = mix(aStart, position, e);
  vec3 perp = normalize(cross(position-aStart, vec3(0.,1.,0.)) + vec3(1e-4));
  p += perp * sin(e*3.14159) * (1. + aSeed.y*2.4);
  p += vec3(sin(uTime*1.2+aSeed.y*40.), cos(uTime*1.0+aSeed.z*40.), sin(uTime*.8+aSeed.y*20.)) * .004 * e;
  float k = (uScanY - p.y) * uDir;                    // k>0 : already scanned
  float band  = exp(-k*k*55.) * uScan;                // soft light band, ~0.25 units thick
  float trail = (k > 0. ? exp(-k*1.8) : 0.) * uScan;
  p.z += band*.10;
  vec4 mv = modelViewMatrix * vec4(p,1.);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = uPx * uSizeK * aSeed.w * (1. + band*.55) * (uCam / -mv.z);
  float lit = uReveal > .5 ? mix(.28, 1., smoothstep(-.08,.08,k)) : 1.;
  float I = aI * lit * (.35 + .65*e) * (1. + band*2.3 + trail*.30);
  vec3 c = mix(uTint, vec3(1.), clamp(I*.55,0.,1.)) * I;
  vCol = mix(c, uScanCol*I*1.15, clamp(band*.6,0.,1.));
  vA = uAlphaK * (.3 + .7*e);
}`;
const FRAG = `varying vec3 vCol; varying float vA;
void main(){ float d = length(gl_PointCoord-.5); if(d>.5) discard; gl_FragColor = vec4(vCol, smoothstep(.5,.2,d)*vA); }`;

let TOP = 9, BOT = -9, FW = 3.1, ready = false, T0 = performance.now();
const hud = { cl:document.getElementById('cl'), cr:document.getElementById('cr'), ru:document.getElementById('ruler') };
if (!CFG.hud) Object.values(hud).forEach(e => e.remove());

(async () => {
  const [fi, di] = await Promise.all([load(FACE), load(DEPTH)]);
  const w = fi.width, h = fi.height, fd = pixels(fi), dd = pixels(di);
  const W = FW = CFG.faceWidth, H = W*h/w, sp = CFG.spacing, rowH = sp*.866;
  const P = [], S = [], SD = [], I = [];
  const avg = (ix,iy,c) => { let s=0; for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){ const x=Math.min(w-1,Math.max(0,ix+i)),y=Math.min(h-1,Math.max(0,iy+j)); s+=fd[(y*w+x)*4+c]; } return s/2295; };
  // evenly spaced hex lattice of dots; brightness (not density) carries the image
  for (let row=0, y=sp*.5; y<h; y+=rowH, row++) for (let x=(row%2)*sp*.5+sp*.5; x<w; x+=sp) {
    const jx = x+(Math.random()-.5)*sp*.2, jy = y+(Math.random()-.5)*sp*.2, ix = jx|0, iy = jy|0;
    if (ix<0||iy<0||ix>=w||iy>=h) continue;
    const a = avg(ix,iy,3); if (a < .05) continue;
    const l = avg(ix,iy,0), b = Math.pow(Math.min(1,Math.max(0,(l-.05)/.85)), 1.3);
    const px=(jx/w-.5)*W, py=(.5-jy/h)*H, pz=(dd[(iy*w+ix)*4]/255-.35)*CFG.depth;
    P.push(px,py,pz);
    const th=Math.random()*6.2832, ph=Math.acos(2*Math.random()-1), r=3+Math.random()*6;
    S.push(Math.sin(ph)*Math.cos(th)*r*1.5, Math.sin(ph)*Math.sin(th)*r*.9, Math.cos(ph)*r*.8+1.5);
    SD.push(Math.random()*.7 + .3*Math.min(1,Math.hypot(px,py)/(W*.6)), Math.random(), Math.random(), .78 + .45*b + Math.random()*.1);
    I.push((.09 + .91*b) * a);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('aStart',   new THREE.Float32BufferAttribute(S,3));
  g.setAttribute('aSeed',    new THREE.Float32BufferAttribute(SD,4));
  g.setAttribute('aI',       new THREE.Float32BufferAttribute(I,1));
  const mk = (sz,al) => { const m = new THREE.Points(g, new THREE.ShaderMaterial({
      uniforms:Object.assign({uSizeK:{value:sz}, uAlphaK:{value:al}}, U), vertexShader:VERT, fragmentShader:FRAG,
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending })); m.frustumCulled=false; group.add(m); };
  mk(7, CFG.glow);   // soft bloom
  mk(1, 1);          // crisp dots
  TOP = H/2 + .1; BOT = -H/2*.78;
  fit(); ready = true; requestAnimationFrame(tick);
})();

let pxU = 1;
function fit(){
  const w = innerWidth, h = innerHeight, th = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const cam = Math.max((CFG.faceWidth*1.18*1.12/2)/th, (CFG.faceWidth*1.25/2)/(th*(w/h)));
  camera.aspect = w/h; camera.position.set(0,0,cam); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  renderer.setSize(w,h,false); U.uCam.value = cam; pxU = h/(2*cam*th);
  U.uPx.value = Math.max(2, h*CFG.dotSize) * renderer.getPixelRatio();
}
addEventListener('resize', fit);
const replay = () => { T0 = performance.now(); };
addEventListener('pointerdown', replay);
addEventListener('keydown', e => { if (e.key.toLowerCase()==='r') replay(); });

const v = new THREE.Vector3(), scr = (x,y) => { v.set(x,y,0); group.localToWorld(v); v.project(camera); return [(v.x*.5+.5)*innerWidth, (-v.y*.5+.5)*innerHeight]; };
const ease = u => .5 - .5*Math.cos(Math.PI*u);

function tick(now){
  const t = (now - T0)/1000;
  U.uTime.value = t; U.uForm.value = Math.min(t/CFG.formTime, 1);

  // scan: first sweep down reveals the face, then it keeps travelling up / down
  let on = 0, y = TOP, dir = -1, reveal = 1;
  if (t > CFG.scanStart) {
    const per = CFG.scanTime + CFG.scanGap, s = t - CFG.scanStart, n = Math.floor(s/per), u = (s-n*per)/CFG.scanTime, k = ease(Math.min(u,1));
    dir = n%2 ? 1 : -1; reveal = n === 0 ? 1 : 0;
    y = dir < 0 ? TOP - k*(TOP-BOT) : BOT + k*(TOP-BOT);
    on = u > 1 ? 0 : Math.min(1, u*6, (1-u)*6);
  }
  U.uScanY.value = y; U.uDir.value = dir; U.uScan.value = on; U.uReveal.value = reveal;

  if (CFG.hud) {                                           // crosshairs ride the scan level, ruler sits above the head
    const f = Math.min(1, Math.max(0, (t - CFG.formTime*.7)/1.2)), a = scr(-FW*.47, y), b = scr(FW*.47, y), r = scr(0, TOP + .08);
    hud.cl.style.transform = `translate(${a[0]}px,${a[1]}px)`; hud.cr.style.transform = `translate(${b[0]}px,${b[1]}px)`;
    hud.cl.style.opacity = hud.cr.style.opacity = f*(.4 + .6*Math.min(1, on*2));
    const rw = FW*.36*pxU; hud.ru.style.width = rw+'px'; hud.ru.style.transform = `translate(${r[0]-rw/2}px,${r[1]-12}px)`; hud.ru.style.opacity = f*.9;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
</script>
</body>
