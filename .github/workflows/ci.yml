name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the requested glassmorphism skill for Claude Code
        run: |
          rm -rf .claude/skills/glassmorphism
          npx -y skills add compozy/compozy --skill glassmorphism --agent claude-code --copy --yes
          test -s .claude/skills/glassmorphism/SKILL.md

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Deterministic journey audio tests
        run: node scripts/test-journey-audio.mjs

      - name: Homepage motion and score-timing tests
        run: node scripts/test-home-motion.mjs

      - name: About scene-motion tests
        run: node scripts/test-about-scene-motion.mjs

      - name: Build
        run: npm run build

      - name: Start production preview
        run: |
          npm run start > /tmp/website-cloner-jp-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/about > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/website-cloner-jp-next.log
          exit 1

      - name: Validate homepage cinematic at desktop
        env:
          CHROMIUM_MULTIPROCESS: '1'
          HOME_VIEWPORT_WIDTH: '1440'
          HOME_HEIGHT: '900'
        run: node scripts/validate-home-motion.mjs

      - name: Validate homepage cinematic at touch mobile
        env:
          CHROMIUM_MULTIPROCESS: '1'
          HOME_VIEWPORT_WIDTH: '390'
          HOME_HEIGHT: '844'
          HOME_TOUCH: '1'
        run: node scripts/validate-home-motion.mjs

      - name: Upload homepage motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-motion-render-evidence
          path: temp/home-motion-*/
          if-no-files-found: ignore

      - name: Validate About wordmark in production browser
        env:
          CHROMIUM_MULTIPROCESS: '1'
        run: node scripts/validate-about-wordmark.mjs

      - name: Upload About wordmark render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-wordmark-render-evidence
          path: temp/about-wordmark-validation/
          if-no-files-found: ignore
